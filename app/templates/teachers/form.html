{% extends "base.html" %}

{% block title %}{{ 'Редактирование' if teacher else 'Добавление' }} учителя - Школьное расписание{% endblock %}

{% block content %}
<div class="page-header">
    <h1>
        <i class="bi bi-person"></i> 
        {{ 'Редактирование учителя' if teacher else 'Добавление учителя' }}
    </h1>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST" action="{{ url_for('teachers.edit', id=teacher.id) if teacher else url_for('teachers.create') }}">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="full_name" class="form-label">ФИО *</label>
                    <input type="text" class="form-control" id="full_name" name="full_name" 
                           value="{{ teacher.full_name if teacher else '' }}" required>
                </div>
                
            </div>
            
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" 
                           value="{{ teacher.email if teacher else '' }}">
                </div>
                
                <div class="col-md-6 mb-3">
                    <label for="phone" class="form-label">Телефон</label>
                    <input type="text" class="form-control" id="phone" name="phone" 
                           value="{{ teacher.phone if teacher else '' }}">
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="home_classroom_id" class="form-label">Прикреплённый кабинет</label>
                    <select class="form-select" id="home_classroom_id" name="home_classroom_id">
                        <option value="">— Не указан —</option>
                        {% for c in classrooms %}
                        <option value="{{ c.id }}" {% if teacher and teacher.home_classroom_id == c.id %}selected{% endif %}>{{ c.display_name }}</option>
                        {% endfor %}
                    </select>
                    <small class="form-text text-muted">Используется в режиме «дети приходят к учителю»</small>
                </div>
            </div>
            
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg"></i> Сохранить
                </button>
                <a href="{{ url_for('teachers.index') }}" class="btn btn-outline-secondary">
                    Отмена
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
