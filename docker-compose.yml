x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-schedule}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-school_schedule}
    volumes:
      - pgdata:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=50
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-schedule} -d ${POSTGRES_DB:-school_schedule}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    logging: *default-logging

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-schedule}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-school_schedule}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      SOLVER_TIME_LIMIT_SEC: ${SOLVER_TIME_LIMIT_SEC:-90}
      SOLVER_NUM_WORKERS: ${SOLVER_NUM_WORKERS:-4}
      # Never run CP-SAT in this 512 MB process — queue profile required.
      SOLVER_ALLOW_IN_PROCESS: "false"
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_MODEL: ${QWEN_MODEL:-qwen-plus}
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 40s
    # Solver must not run here — use the queue worker (4g). This cap keeps the API small.
    mem_limit: 512m
    logging: *default-logging

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 64m
    logging: *default-logging

  redis:
    profiles: ["queue"]
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    mem_limit: 64m
    logging: *default-logging

  worker:
    profiles: ["queue"]
    build: .
    restart: unless-stopped
    command:
      [
        "celery",
        "-A",
        "backend.celery_app",
        "worker",
        "--loglevel=info",
        "--concurrency=1",
        "--prefetch-multiplier=1",
      ]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-schedule}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-school_schedule}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      SOLVER_TIME_LIMIT_SEC: ${SOLVER_TIME_LIMIT_SEC:-90}
      # Keep equal to worker cpus (compose default 4). More threads than cores contend.
      SOLVER_NUM_WORKERS: ${SOLVER_NUM_WORKERS:-4}
    mem_limit: ${SOLVER_MEM_LIMIT:-4g}
    cpus: ${SOLVER_CPUS:-4}
    logging: *default-logging

volumes:
  pgdata:
