{% extends "base.html" %}

{% block title %}Настройки расписания - Школьное расписание{% endblock %}

{% block content %}
<div class="page-header">
    <h1><i class="bi bi-gear"></i> Настройки расписания</h1>
</div>

<div class="row">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-success text-white">
                <i class="bi bi-building"></i> Начальная школа
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('schedule.settings') }}">
                    <input type="hidden" name="school_level" value="elementary">
                    
                    <div class="mb-3">
                        <label for="working_days_el" class="form-label">Учебных дней в неделю</label>
                        <select class="form-select" id="working_days_el" name="working_days">
                            <option value="5" {% if elementary_settings and elementary_settings.working_days == 5 %}selected{% endif %}>
                                5 дней (Пн-Пт)
                            </option>
                            <option value="6" {% if elementary_settings and elementary_settings.working_days == 6 %}selected{% endif %}>
                                6 дней (Пн-Сб)
                            </option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label for="max_lessons_el" class="form-label">Максимум уроков в день</label>
                        <input type="number" class="form-control" id="max_lessons_el" name="max_lessons_per_day"
                               value="{{ elementary_settings.max_lessons_per_day if elementary_settings else 5 }}"
                               min="1" max="10">
                    </div>
                    <div class="mb-3">
                        <label for="max_subject_el" class="form-label">Максимум уроков одного предмета в день</label>
                        <select class="form-select" id="max_subject_el" name="max_lessons_per_subject_per_day">
                            <option value="1" {% if elementary_settings and elementary_settings.max_lessons_per_subject_per_day == 1 %}selected{% endif %}>1 урок</option>
                            <option value="2" {% if not elementary_settings or elementary_settings.max_lessons_per_subject_per_day == 2 %}selected{% endif %}>2 урока</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="classroom_mode_el" class="form-label">Режим кабинетов</label>
                        <select class="form-select" id="classroom_mode_el" name="classroom_mode">
                            <option value="class_room" {% if not elementary_settings or elementary_settings.classroom_mode == 'class_room' %}selected{% endif %}>Учитель приходит к классу</option>
                            <option value="teacher_room" {% if elementary_settings and elementary_settings.classroom_mode == 'teacher_room' %}selected{% endif %}>Дети приходят к учителю</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="elementary_group_leave" name="elementary_group_subjects_leave"
                                   {% if not elementary_settings or elementary_settings.elementary_group_subjects_leave %}checked{% endif %}>
                            <label class="form-check-label" for="elementary_group_leave">Групповые уроки: дети уходят к учителю</label>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-check-lg"></i> Сохранить
                    </button>
                </form>
            </div>
        </div>
    </div>
    
    <div class="col-md-6">
        <div class="card">
            <div class="card-header text-white" style="background-color: #9b59b6;">
                <i class="bi bi-building"></i> Основная школа
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('schedule.settings') }}">
                    <input type="hidden" name="school_level" value="secondary">
                    
                    <div class="mb-3">
                        <label for="working_days_sec" class="form-label">Учебных дней в неделю</label>
                        <select class="form-select" id="working_days_sec" name="working_days">
                            <option value="5" {% if secondary_settings and secondary_settings.working_days == 5 %}selected{% endif %}>
                                5 дней (Пн-Пт)
                            </option>
                            <option value="6" {% if secondary_settings and secondary_settings.working_days == 6 %}selected{% endif %}>
                                6 дней (Пн-Сб)
                            </option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label for="max_lessons_sec" class="form-label">Максимум уроков в день</label>
                        <input type="number" class="form-control" id="max_lessons_sec" name="max_lessons_per_day"
                               value="{{ secondary_settings.max_lessons_per_day if secondary_settings else 7 }}"
                               min="1" max="10">
                    </div>
                    <div class="mb-3">
                        <label for="max_subject_sec" class="form-label">Максимум уроков одного предмета в день</label>
                        <select class="form-select" id="max_subject_sec" name="max_lessons_per_subject_per_day">
                            <option value="1" {% if secondary_settings and secondary_settings.max_lessons_per_subject_per_day == 1 %}selected{% endif %}>1 урок</option>
                            <option value="2" {% if not secondary_settings or secondary_settings.max_lessons_per_subject_per_day == 2 %}selected{% endif %}>2 урока</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="classroom_mode_sec" class="form-label">Режим кабинетов</label>
                        <select class="form-select" id="classroom_mode_sec" name="classroom_mode">
                            <option value="class_room" {% if not secondary_settings or secondary_settings.classroom_mode == 'class_room' %}selected{% endif %}>Учитель приходит к классу</option>
                            <option value="teacher_room" {% if secondary_settings and secondary_settings.classroom_mode == 'teacher_room' %}selected{% endif %}>Дети приходят к учителю</option>
                        </select>
                    </div>
                    
                    <button type="submit" class="btn text-white" style="background-color: #9b59b6;">
                        <i class="bi bi-check-lg"></i> Сохранить
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<div class="mt-4">
    <a href="{{ url_for('schedule.index') }}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left"></i> Вернуться к расписанию
    </a>
</div>
{% endblock %}
