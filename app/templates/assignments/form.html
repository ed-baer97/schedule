{% extends "base.html" %}

{% block title %}{{ 'Редактирование' if assignment else 'Добавление' }} назначения - Школьное расписание{% endblock %}

{% block content %}
<div class="page-header">
    <h1>
        <i class="bi bi-person-check"></i> 
        {{ 'Редактирование назначения' if assignment else 'Добавление назначения' }}
    </h1>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST" action="{{ url_for('assignments.edit', id=assignment.id) if assignment else url_for('assignments.create') }}">
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label for="class_id" class="form-label">Класс *</label>
                    <select class="form-select" id="class_id" name="class_id" required>
                        <option value="">Выберите класс...</option>
                        {% for school_class in classes %}
                        <option value="{{ school_class.id }}" 
                                {% if assignment and assignment.class_id == school_class.id %}selected{% endif %}>
                            {{ school_class.name }} ({{ school_class.school_level_display }})
                        </option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="col-md-4 mb-3">
                    <label for="subject_id" class="form-label">Предмет *</label>
                    <select class="form-select" id="subject_id" name="subject_id" required>
                        <option value="">Выберите предмет...</option>
                        {% for subject in subjects %}
                        <option value="{{ subject.id }}" 
                                {% if assignment and assignment.subject_id == subject.id %}selected{% endif %}>
                            {{ subject.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="col-md-4 mb-3">
                    <label for="hours_per_week" class="form-label">Часов в неделю *</label>
                    <input type="number" class="form-control" id="hours_per_week" name="hours_per_week" 
                           value="{{ assignment.hours_per_week if assignment else 1 }}" 
                           min="1" max="20" required>
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label for="teacher_id" class="form-label">Учитель</label>
                    <select class="form-select" id="teacher_id" name="teacher_id">
                        <option value="">— Не назначен —</option>
                        {% for teacher in teachers %}
                        <option value="{{ teacher.id }}" 
                                {% if assignment and assignment.teacher_id == teacher.id %}selected{% endif %}>
                            {{ teacher.full_name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="col-md-4 mb-3">
                    <label for="group_number" class="form-label">Группа</label>
                    <select class="form-select" id="group_number" name="group_number">
                        <option value="">Весь класс</option>
                        <option value="1" {% if assignment and assignment.group_number == 1 %}selected{% endif %}>
                            Группа 1
                        </option>
                        <option value="2" {% if assignment and assignment.group_number == 2 %}selected{% endif %}>
                            Группа 2
                        </option>
                    </select>
                    <small class="text-muted">Для деления на подгруппы</small>
                </div>
                
                <div class="col-md-4 mb-3">
                    <label for="preferred_classroom_id" class="form-label">Предпочтительный кабинет</label>
                    <select class="form-select" id="preferred_classroom_id" name="preferred_classroom_id">
                        <option value="">— Любой —</option>
                        <!-- Add classrooms if needed -->
                    </select>
                </div>
            </div>
            
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg"></i> Сохранить
                </button>
                <a href="{{ url_for('assignments.index') }}" class="btn btn-outline-secondary">
                    Отмена
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
